<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bát Tự chuyên sâu (thử nghiệm)</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="/css/app.css">
<style>
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#faf6ef;color:#282923}
main{max-width:920px;margin:0 auto;padding:16px clamp(16px,4vw,32px) 72px}
.bd-label{position:sticky;top:0;z-index:5;background:#7a1f1f;color:#fff;font-weight:600;padding:10px 14px;border-radius:0 0 10px 10px;margin:0 0 14px}
.bd-banner,.bd-review,.bd-note{color:#555;font-size:.9rem}
.bd-state{border:2px solid #b08a2e;background:#fff7e0;border-radius:12px;padding:6px 14px;margin:12px 0;font-weight:600}
.bd-state-agreement_not_proof{border-color:#8a8a8a;background:#f1f1f1}
.bd-conflict{border:2px dashed #7a1f1f;background:#fff0f0;border-radius:12px;padding:6px 14px;margin:12px 0}
.bd-disagree,.bd-method{border:1px solid #d8d0c0;background:#fff;border-radius:12px;padding:8px 16px;margin:12px 0}
.bd-badge{margin-left:10px;font-size:.72rem;font-weight:600;background:#eee;border-radius:99px;padding:2px 10px;vertical-align:middle}
.bd-line{margin:3px 0}.bd-levels{padding-left:18px;margin:8px 0;font-size:.88rem}.bd-reading{border-left:3px solid #d8d0c0;padding-left:10px;margin:8px 0}
form{display:flex;flex-wrap:wrap;gap:10px;align-items:end;margin:12px 0}form label{display:flex;flex-direction:column;font-size:.78rem;gap:3px}form input,form select{height:38px;font-size:.95rem}
button{font:600 .9rem system-ui;padding:10px 20px;border-radius:99px;border:0;background:#7a1f1f;color:#fff;cursor:pointer}
</style></head><body><main>
<h1>Bát Tự chuyên sâu</h1>
<p class="bd-banner">Bản thử nghiệm dành cho người muốn xem từng phương pháp và nguồn của nó. Mặc định tắt. Dữ liệu ngày sinh chỉ xử lý trong bộ nhớ, không lưu.</p>
<form id="f"><label>Năm<input id="y" type="number" value="1990" min="1900" max="2049" style="width:84px"></label><label>Tháng<input id="m" type="number" value="12" min="1" max="12" style="width:64px"></label>
<label>Ngày<input id="d" type="number" value="15" min="1" max="31" style="width:64px"></label><label>Giờ<input id="h" type="number" value="10" min="0" max="23" style="width:64px"></label>
<label>Phút<input id="mi" type="number" value="0" min="0" max="59" style="width:64px"></label><label>Giới<select id="g"><option value="male">Nam</option><option value="female">Nữ</option></select></label>
<label style="flex-direction:row;align-items:center;gap:6px"><input id="on" type="checkbox"> Bật phân tích chuyên sâu (thử nghiệm)</label><button type="submit">Xem</button></form>
<div id="out"><p class="bd-off">Chế độ phân tích chuyên sâu đang tắt. Bật để xem từng phương pháp, nguồn và mức xác minh.</p></div>
</main>
<script src="/js/bazi_deep_draft.js"></script>
<script>
document.getElementById("f").addEventListener("submit", function (e) {
  e.preventDefault();
  var out = document.getElementById("out"), on = document.getElementById("on").checked;
  if (!on) { out.textContent = ""; var p = document.createElement("p"); p.className = "bd-off"; p.textContent = "Chế độ phân tích chuyên sâu đang tắt. Bật để xem từng phương pháp, nguồn và mức xác minh."; out.appendChild(p); return; }
  var v = function (id) { return document.getElementById(id).value; };
  var body = { year: +v("y"), month: +v("m"), day: +v("d"), hour: +v("h"), minute: +v("mi"), gender: v("g"), bazi_deep_draft: true };
  out.textContent = "Đang tính…";
  fetch("/api/bazi-structure", { method: "POST", headers: { "content-type": "application/json" }, body: JSON.stringify(body) })
    .then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.json(); })
    .then(function (j) { BaziDeepDraft.render(out, BaziDeepDraft.buildViewModel(j)); })
    .catch(function (err) { out.textContent = "Không tính được: " + err.message; });
});
</script></body></html>
